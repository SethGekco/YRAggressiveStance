name: Build YRAggressiveStance

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install ATL
        shell: pwsh
        run: |
          $atlFile = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "atlbase.h" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($atlFile) {
            Write-Host "Found atlbase.h at: $($atlFile.FullName)"
            $clExe = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "cl.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*HostX86\x86*" } | Select-Object -First 1
            Write-Host "Found cl.exe at: $($clExe.FullName)"
            $msvcInc = Join-Path (Split-Path (Split-Path (Split-Path $clExe.FullName))) "include"
            Write-Host "Copying to: $msvcInc"
            Copy-Item $atlFile.FullName "$msvcInc\" -Force
          } else {
            Write-Error "atlbase.h not found anywhere"
          }

      - name: Build
        run: msbuild YRAggressiveStance.sln /p:Configuration=DevBuild /p:Platform=x86

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YRAggressiveStance
          path: DevBuild\YRAggressiveStance.dll
