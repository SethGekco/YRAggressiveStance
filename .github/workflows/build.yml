name: Build YRAggressiveStance

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install ATL
        shell: pwsh
        run: |
          $src = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.51.36231\atlmfc\include\atlbase.h"
          $dst = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.29.30133\include\"
          Write-Host "Copying $src to $dst"
          Copy-Item $src $dst -Force
          Write-Host "Done"

      - name: Build
        run: msbuild YRAggressiveStance.sln /p:Configuration=DevBuild /p:Platform=x86

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YRAggressiveStance
          path: DevBuild\YRAggressiveStance.dll
