name: Build YRAggressiveStance

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install ATL
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvcRoot = "$vsPath\VC\Tools\MSVC"
          $msvcVer = (Get-ChildItem $msvcRoot | Sort-Object Name -Descending | Select-Object -First 1).Name
          Write-Host "Found MSVC version: $msvcVer"
          $atlSrc = "$msvcRoot\$msvcVer\atlmfc\include"
          $vcInc  = "$msvcRoot\$msvcVer\include"
          Write-Host "ATL source: $atlSrc"
          if (Test-Path $atlSrc) { Copy-Item "$atlSrc\atlbase.h" "$vcInc\" -Force }
          else { Write-Error "ATL source not found at $atlSrc" }

      - name: Build
        run: msbuild YRAggressiveStance.sln /p:Configuration=DevBuild /p:Platform=x86

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YRAggressiveStance
          path: DevBuild\YRAggressiveStance.dll
